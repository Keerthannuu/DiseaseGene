test_cases:
- id: SEC-001
  category: headers
  name: Strict-Transport-Security (HSTS) Header Presence
  priority: critical
  description: Inspect HSTS header on HTTPS responses
  expected_result: max-age >= 31536000 and includeSubDomains present
- id: SEC-002
  category: headers
  name: X-Content-Type-Options Header Verification
  priority: high
  description: Inspect X-Content-Type-Options header on API responses
  expected_result: Header set to 'nosniff' preventing MIME sniffing
- id: SEC-003
  category: headers
  name: X-Frame-Options Header Check
  priority: high
  description: Verify X-Frame-Options on web pages
  expected_result: Header set to 'DENY' or 'SAMEORIGIN' preventing clickjacking
- id: SEC-004
  category: headers
  name: Content-Security-Policy (CSP) Directives
  priority: critical
  description: Verify CSP header on web responses
  expected_result: Valid CSP restricting default-src, script-src, object-src
- id: SEC-005
  category: headers
  name: Referrer-Policy Header Check
  priority: medium
  description: Verify Referrer-Policy header
  expected_result: Set to 'strict-origin-when-cross-origin' or 'no-referrer'
- id: SEC-006
  category: headers
  name: Permissions-Policy Header Check
  priority: medium
  description: Verify Permissions-Policy header
  expected_result: Restricts camera, microphone, geolocation APIs
- id: SEC-007
  category: headers
  name: Server Banner Information Disclosure
  priority: high
  description: Inspect Server header on responses
