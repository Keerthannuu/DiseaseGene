name: Appium Mobile Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Environment"
        required: false
        default: "test"
        type: string
      android_version:
        description: "Android Version"
        required: false
        default: "13.0"
        type: choice
        options:
          - "13.0"
          - "12.0"
          - "14.0"
      test_group:
        description: "Test Group"
        required: false
        default: "all"
        type: string

concurrency:
  group: appium-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-specs:
    name: Validate Test Cases Specification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate 300 Appium Specs (APP-001 -> APP-300)
        run: python scripts/validate_test_cases.py

  appium-tests:
    name: Appium Shard ${{ matrix.shard }}/4
    needs: [validate-specs]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    env:
      ANDROID_DEVICE_NAME: "emulator-5554"
      ANDROID_PLATFORM_VERSION: ${{ github.event.inputs.android_version || '13.0' }}
      ANDROID_APP_PACKAGE: "com.romcom.diseasegenemap"
      ANDROID_APP_ACTIVITY: ".MainActivity"
      APPIUM_SERVER_URL: "http://localhost:4723"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-html pytest-rerunfailures pytest-xdist pydantic-settings requests pyyaml Appium-Python-Client selenium

      - name: Create Reports Directory
        run: mkdir -p tests/appium/reports/screenshots tests/appium/reports/logs

      - name: Run Appium Tests (Shard ${{ matrix.shard }}/4)
        id: run_tests
        continue-on-error: true
        run: |
          case "${{ matrix.shard }}" in
            1)
              TEST_FILES="tests/appium/test_cases/test_lifecycle_install.py tests/appium/test_cases/test_mobile_auth.py"
              ;;
            2)
              TEST_FILES="tests/appium/test_cases/test_navigation_gestures.py tests/appium/test_cases/test_associations_variants_pathways.py"
              ;;
            3)
              TEST_FILES="tests/appium/test_cases/test_mobile_genes_diseases.py"
              ;;
            4)
              TEST_FILES="tests/appium/test_cases/test_analytics_favorites_admin.py tests/appium/test_cases/test_edge_network_device.py"
              ;;
          esac

          pytest -q $TEST_FILES \
            --junitxml=tests/appium/reports/junit-shard-${{ matrix.shard }}.xml \
            --html=tests/appium/reports/report-shard-${{ matrix.shard }}.html \
            --self-contained-html || true

      - name: Generate Minimal Console Summary & Step Summary
        run: |
          python scripts/generate_ci_summary.py \
            --suite appium \
            --shard "${{ matrix.shard }}/4" \
            --junit "tests/appium/reports/junit-shard-${{ matrix.shard }}.xml"

      - name: Upload Shard Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-report-shard-${{ matrix.shard }}
          path: |
            tests/appium/reports/
          retention-days: 14
