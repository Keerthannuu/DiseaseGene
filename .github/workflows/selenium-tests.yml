name: Selenium UI Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Environment"
        required: false
        default: "test"
        type: string
      browser:
        description: "Browser"
        required: false
        default: "chrome"
        type: choice
        options:
          - chrome
          - firefox
      test_group:
        description: "Test Group filter"
        required: false
        default: "all"
        type: string

concurrency:
  group: selenium-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-specs:
    name: Validate Test Cases Specification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate 300 Selenium Specs (SEL-001 -> SEL-300)
        run: python scripts/validate_test_cases.py

  selenium-tests:
    name: Selenium Shard ${{ matrix.shard }}/4
    needs: [validate-specs]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    env:
      BASE_URL: ${{ secrets.BASE_URL || 'http://localhost:3000' }}
      TEST_USERNAME: ${{ secrets.TEST_USERNAME || 'test_researcher' }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD || 'TestPassword123!' }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME || 'test_admin' }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'AdminPassword123!' }}
      HEADLESS: "true"
      SELENIUM_BROWSER: ${{ github.event.inputs.browser || 'chrome' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-html pytest-rerunfailures pytest-xdist selenium pydantic-settings requests pyyaml

      - name: Create Reports Directory
        run: mkdir -p tests/selenium/reports/screenshots tests/selenium/reports/logs

      - name: Run Selenium Tests (Shard ${{ matrix.shard }}/4)
        id: run_tests
        continue-on-error: true
        run: |
          case "${{ matrix.shard }}" in
            1)
              TEST_FILES="tests/selenium/test_cases/test_authentication.py tests/selenium/test_cases/test_navigation.py"
              ;;
            2)
              TEST_FILES="tests/selenium/test_cases/test_genes.py tests/selenium/test_cases/test_diseases.py"
              ;;
            3)
              TEST_FILES="tests/selenium/test_cases/test_associations_variants.py tests/selenium/test_cases/test_pathways_drugs.py"
              ;;
            4)
              TEST_FILES="tests/selenium/test_cases/test_publications_search.py tests/selenium/test_cases/test_analytics_insights.py tests/selenium/test_cases/test_admin_security_ui.py"
              ;;
          esac

          pytest -q $TEST_FILES \
            -n auto \
            --reruns 1 \
            --junitxml=tests/selenium/reports/junit-shard-${{ matrix.shard }}.xml \
            --html=tests/selenium/reports/report-shard-${{ matrix.shard }}.html \
            --self-contained-html || true

      - name: Generate Minimal Console Summary & Step Summary
        run: |
          python scripts/generate_ci_summary.py \
            --suite selenium \
            --shard "${{ matrix.shard }}/4" \
            --junit "tests/selenium/reports/junit-shard-${{ matrix.shard }}.xml"

      - name: Upload Shard Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-report-shard-${{ matrix.shard }}
          path: |
            tests/selenium/reports/
          retention-days: 14
